<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STATION IA · M2/M5</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b; --panel: #111318; --soft: #181b22; --line: #2c313b;
      --text: #f4f5f7; --muted: #9ca3af; --ok: #29b765; --warn: #d89621;
      --bad: #e5484d; --blue: #4da3ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 2; background: #08090bf4; border-bottom: 1px solid var(--line); padding: 10px 12px; backdrop-filter: blur(10px); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { margin: 0; font-size: 17px; line-height: 1.15; }
    .state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px #d8962122; display: inline-block; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px #29b76522; }
    .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px #e5484d22; }
    .stamp { margin-top: 4px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    main { max-width: 1440px; margin: 0 auto; padding: 10px; display: grid; gap: 10px; }
    .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; position: sticky; top: 61px; z-index: 1; background: #08090bf4; padding-bottom: 2px; }
    button, a, select, textarea { font: inherit; }
    button, a { min-height: 38px; border: 1px solid var(--line); border-radius: 7px; background: var(--soft); color: var(--text); padding: 8px 10px; text-decoration: none; cursor: pointer; }
    .tab { color: var(--muted); }
    .tab.active, .primary { background: #123456; border-color: #2f74bd; color: var(--text); }
    .panel { display: none; }
    .panel.active { display: block; }
    .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .box-head { min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); }
    .box-head strong { font-size: 13px; }
    iframe { display: block; width: 100%; height: calc(100dvh - 153px); min-height: 520px; border: 0; background: #050608; }
    .console { padding: 12px; display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: #0c0f14; color: var(--text); padding: 10px; }
    textarea { min-height: 180px; resize: vertical; line-height: 1.45; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .log { min-height: 180px; max-height: 42dvh; overflow: auto; border: 1px solid var(--line); border-radius: 7px; background: #080a0e; padding: 10px; display: grid; gap: 8px; }
    .msg { padding: 9px 10px; border-radius: 7px; background: var(--soft); font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.me { border-left: 3px solid var(--blue); }
    .msg.sys { border-left: 3px solid var(--ok); color: var(--muted); }
    .msg.err { border-left: 3px solid var(--bad); color: #ffc7c7; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 7px; }
    .card h2 { margin: 0; font-size: 15px; }
    .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .badge { display: inline-flex; width: max-content; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; font-size: 12px; color: var(--muted); }
    @media (max-width: 720px) {
      header { padding: 9px 10px; }
      main { padding: 8px; }
      .tabs { top: 58px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .top { align-items: start; }
      .state { white-space: normal; justify-content: flex-end; text-align: right; }
      iframe { height: calc(100dvh - 197px); min-height: 440px; }
      .row { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      button, a { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>STATION IA · M2/M5</h1>
      <span class="state"><span class="dot" id="chat-dot"></span><span id="chat-state">test...</span></span>
    </div>
    <div class="stamp" id="stamp">chargement...</div>
  </header>
  <main>
    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-tab="chat" onclick="showTab('chat')">Chat</button>
      <button class="tab" data-tab="send" onclick="showTab('send')">Ordre</button>
      <button class="tab" data-tab="services" onclick="showTab('services')">Services</button>
      <button class="tab" data-tab="nodes" onclick="showTab('nodes')">M2/M5</button>
    </nav>
    <section class="panel active" id="tab-chat">
      <div class="box">
        <div class="box-head">
          <strong>Chat principal</strong>
          <a href="/conversation?destination=m2" target="_top">ouvrir plein écran</a>
        </div>
        <iframe src="/conversation?destination=m2" title="Chat STATION IA"></iframe>
      </div>
    </section>
    <section class="panel" id="tab-send">
      <div class="box console">
        <div class="row"><select id="destination"></select><select id="model"></select></div>
        <select id="goal"></select>
        <textarea id="prompt" placeholder="Ordre ou prompt..."></textarea>
        <div class="actions"><button class="primary" onclick="sendPrompt()">Envoyer</button><button onclick="newSession()">Nouvelle session</button></div>
        <div class="log" id="chatlog"><div class="msg sys">Envoi direct prêt.</div></div>
      </div>
    </section>
    <section class="panel" id="tab-services"><div class="cards" id="services"></div></section>
    <section class="panel" id="tab-nodes"><div class="cards" id="nodes"></div></section>
  </main>
  <script>
    let sessionId = localStorage.getItem('station.control.sessionId') || '';
    function showTab(name) {
      document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === name));
      document.querySelectorAll('.panel').forEach(el => el.classList.toggle('active', el.id === 'tab-' + name));
      localStorage.setItem('station.control.tab', name);
    }
    function addMsg(kind, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      el.textContent = text;
      document.getElementById('chatlog').appendChild(el);
      el.scrollIntoView({ block: 'end' });
    }
    function setDot(kind, text) {
      chatDot.className = 'dot' + (kind ? ' ' + kind : '');
      chatState.textContent = text;
    }
    async function loadOptions() {
      try {
        const res = await fetch('/api/conversation/options', { cache: 'no-store' });
        const data = await res.json();
        document.getElementById('destination').replaceChildren(...(data.destinations || []).map(item => option(item.id, item.name + (item.available ? '' : ' · indispo'), !item.available)));
        document.getElementById('model').replaceChildren(...[...(data.models || []), ...(data.m2_models || [])].map(item => option(item.name, item.name, false)));
        document.getElementById('goal').replaceChildren(...(data.goals || [{id:'station-tasks', title:'Tâches de la station'}]).map(item => option(item.id, item.title || item.id, false)));
      } catch (error) {
        addMsg('err', 'Options indisponibles: ' + error);
      }
    }
    function option(value, text, disabled) {
      const opt = document.createElement('option');
      opt.value = value; opt.textContent = text; opt.disabled = disabled;
      return opt;
    }
    function newSession() {
      sessionId = '';
      localStorage.removeItem('station.control.sessionId');
      addMsg('sys', 'Nouvelle session prête.');
    }
    async function ensureSession() {
      if (sessionId) return sessionId;
      const res = await fetch('/api/conversation/open', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          destination: document.getElementById('destination').value || 'm2',
          model: document.getElementById('model').value,
          goal_id: document.getElementById('goal').value || 'station-tasks'
        })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'session non créée');
      sessionId = data.session_id || data.id || data.sid || (data.session && data.session.session_id);
      if (!sessionId) throw new Error('session_id absent');
      localStorage.setItem('station.control.sessionId', sessionId);
      addMsg('sys', 'Session ouverte: ' + sessionId);
      return sessionId;
    }
    async function sendPrompt() {
      const promptBox = document.getElementById('prompt');
      const text = promptBox.value.trim();
      if (!text) return;
      promptBox.value = '';
      addMsg('me', text);
      try {
        const sid = await ensureSession();
        const res = await fetch('/api/conversation/send', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ session_id: sid, message: text, client_turn_id: crypto.randomUUID() })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'envoi refusé');
        addMsg('sys', data.reply || data.message || data.text || JSON.stringify(data, null, 2));
      } catch (error) {
        addMsg('err', String(error));
      }
    }
    async function refresh() {
      try {
        const res = await fetch('/api/state', { cache: 'no-store' });
        const data = await res.json();
        const serviceMap = data.services || {};
        const loopx = serviceMap.loopx;
        if (loopx && loopx.available) setDot('ok', 'Chat OK');
        else if (data.checked_at) setDot('', 'LoopX partiel');
        else setDot('bad', 'Chat KO');
        document.getElementById('stamp').textContent = (data.host || 'STATION IA') + ' · ' + (data.checked_at || new Date().toLocaleString());
        document.getElementById('services').replaceChildren(...Object.entries(serviceMap).map(([id, svc]) => card(svc.name, svc.detail || '', svc.available, svc.url)));
        const groups = { M2: [], M5: [] };
        Object.values(serviceMap).forEach(svc => groups[String(svc.name || '').includes('M2') ? 'M2' : 'M5'].push(svc));
        document.getElementById('nodes').replaceChildren(...Object.entries(groups).map(([name, list]) => {
          const ok = list.filter(item => item.available);
          return card(name, ok.map(item => item.name).join('\\n') || 'Aucun service OK', ok.length > 0, '');
        }));
      } catch (error) {
        setDot('bad', 'Chat KO');
        document.getElementById('stamp').textContent = 'API STATION IA inaccessible';
      }
    }
    function card(title, detail, ok, url) {
      const el = document.createElement('article');
      el.className = 'card';
      const link = url ? '<a href="'+url+'" target="_blank">ouvrir</a>' : '';
      el.innerHTML = '<span class="badge"><span class="dot '+(ok?'ok':'bad')+'"></span>'+(ok?'OK':'OFF')+'</span><h2>'+escapeHtml(title)+'</h2><div class="meta">'+escapeHtml(detail).replaceAll('\\n','<br>')+'</div>'+link;
      return el;
    }
    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    const chatDot = document.getElementById('chat-dot');
    const chatState = document.getElementById('chat-state');
    showTab(localStorage.getItem('station.control.tab') || 'chat');
    loadOptions();
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
