<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat · Station</title>
<style>
:root{color-scheme:dark;font:15px/1.6 -apple-system,system-ui,sans-serif;color:#f2f2f5;background:#07070b}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid #2c2c3a;background:#0f0f15}h1{font-size:16px;margin:0}small,#status{font-size:12px;color:#b8b8be}main{flex:1;overflow:auto;min-height:0;padding:20px max(18px,calc((100% - 860px)/2))}.empty{max-width:620px;margin:8vh auto;color:#b8b8be}.empty h2{font-size:24px;color:#f2f2f5;font-weight:550}.message{margin:0 0 20px;max-width:100%;overflow-wrap:anywhere}.message strong{font-size:12px;color:#aeb8ce}.message p{white-space:pre-wrap;margin:5px 0}.user{background:#182637;border:1px solid #2b425d;padding:12px 16px;border-radius:12px;margin-left:12%}.agent{padding:5px 0}.error{color:#ffaaa3}.composer{border-top:1px solid #2c2c3a;padding:12px max(14px,calc((100% - 860px)/2));background:#0f0f15}form{display:flex;gap:10px;align-items:end}textarea{font:inherit;background:#16161e;border:1px solid #464658;border-radius:10px;color:#f2f2f5;resize:vertical;flex:1;min-width:0;min-height:72px;max-height:220px;padding:12px}button{background:#176dbe;border:1px solid #409cff;color:white;border-radius:8px;padding:12px 18px;min-height:46px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#77baff;font-size:12px}:focus-visible{outline:2px solid #77baff;outline-offset:2px}#status{min-height:22px;margin-top:5px}.hint{margin:0;font-size:11px;color:#a0a0ab}@media(max-width:600px){header{padding:8px 12px}header small{display:none}main{padding:14px}.composer{padding:10px}textarea{font-size:16px}button{padding:12px}.user{margin-left:4%}.empty{margin:20px auto}}
</style>
<header><div><h1>Chat <small>avec Codex</small></h1></div><a href="http://127.0.0.1:8870/chat/" target="_blank" rel="noopener">Historique LoopX ↗</a></header>
<main id="messages" aria-label="Conversation"><div class="empty"><h2>De quoi veux-tu parler ?</h2><p>Écris ton message ci-dessous. Les tâches à exécuter restent dans l’onglet « Tâches & résultats ».</p></div></main>
<div class="composer"><form id="form"><textarea id="input" aria-label="Ton message" placeholder="Écris ton message…" maxlength="6000" required></textarea><button id="send">Envoyer</button></form><div id="status" role="status">Prêt à discuter.</div><p class="hint">Entrée pour envoyer · Majuscule + Entrée pour une nouvelle ligne</p></div>
<script>
const $=id=>document.getElementById(id);let sid=null,busy=false,working=false,last='',turnId=null;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Connexion indisponible');return d;}
function state(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
function render(d){working=!!(d.active_turn||d.session?.active_turn_id);$('send').disabled=busy||working;const messages=(d.messages||[]).filter(m=>m.text);const signature=JSON.stringify(messages);if(signature!==last&&messages.length){const nearEnd=$('messages').scrollHeight-$('messages').scrollTop-$('messages').clientHeight<90;last=signature;$('messages').replaceChildren();for(const m of messages){const box=document.createElement('article');box.className='message '+(m.role==='user'?'user':m.role==='error'?'error':'agent');const who=document.createElement('strong');who.textContent=m.role==='user'?'Toi':m.role==='error'?'Erreur':'Codex';const text=document.createElement('p');text.textContent=m.text;box.append(who,text);$('messages').append(box);}if(nearEnd)$('messages').scrollTop=$('messages').scrollHeight;}state(working?'Codex prépare sa réponse…':'Prêt à discuter.');}
async function refresh(){if(!sid||busy)return;try{render(await api('/api/conversation/'+sid));}catch(e){state(e.message,true);}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy||working||!$('input').value.trim())return;busy=true;$('send').disabled=true;state('Envoi…');try{if(!sid){const d=await api('/api/conversation/open',{});sid=d.session?.session_id||d.session_id;if(!sid)throw Error('Session non disponible');try{localStorage.setItem('station.chat.session',sid);}catch{}}turnId??=crypto.randomUUID();await api('/api/conversation/send',{session_id:sid,message:$('input').value,client_turn_id:turnId});$('input').value='';turnId=null;working=true;state('Codex prépare sa réponse…');}catch(e){state(e.message+' Ton message est conservé.',true);}finally{busy=false;$('send').disabled=working;if(working)await refresh();}};
$('input').addEventListener('input',()=>turnId=null);$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit();}};try{const saved=localStorage.getItem('station.chat.session');if(/^[a-f0-9]{32}$/.test(saved||''))sid=saved;}catch{}
refresh();setInterval(refresh,2000);
</script></html>
