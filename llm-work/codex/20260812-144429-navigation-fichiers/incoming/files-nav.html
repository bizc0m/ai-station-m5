<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Station Files</title>
  <style>
    :root {
      --bg: #f5f4f2;
      --bg2: #ece9e4;
      --text: #2a2a2a;
      --text2: #666;
      --accent: #0d9488;
      --border: #d4cfc6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1a1a;
        --bg2: #2a2a2a;
        --text: #f5f4f2;
        --text2: #b0aca3;
        --border: #3a3a3a;
        --accent: #14b8a6;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; line-height: 1.4; padding: 12px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .tab-btn { background: none; border: none; color: var(--text2); font-size: 12px; padding: 6px 12px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .content { display: none; grid: auto-flow dense / repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .content.active { display: grid; }
    .file-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .file-card:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px); }
    .file-icon { font-size: 20px; margin-bottom: 4px; }
    .file-name { font-size: 11px; font-weight: 500; word-break: break-word; line-height: 1.3; }
    .file-size { font-size: 9px; opacity: 0.6; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Station</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('core')">Core</button>
      <button class="tab-btn" onclick="switchTab('tools')">Tools</button>
      <button class="tab-btn" onclick="switchTab('docs')">Docs</button>
    </div>

    <div id="core" class="content active">
      <div class="file-card" onclick="open_file('AI-Station.html')">
        <div class="file-icon">🚀</div>
        <div class="file-name">AI-Station</div>
        <div class="file-size">67 KB</div>
      </div>
      <div class="file-card" onclick="open_file('Prompt-Master.html')">
        <div class="file-icon">📝</div>
        <div class="file-name">Prompt Master</div>
        <div class="file-size">43 KB</div>
      </div>
    </div>

    <div id="tools" class="content">
      <div class="file-card" onclick="open_file('Agent-Queue.html')">
        <div class="file-icon">⚙️</div>
        <div class="file-name">Agent Queue</div>
        <div class="file-size">17 KB</div>
      </div>
      <div class="file-card" onclick="open_file('index.html')">
        <div class="file-icon">🏠</div>
        <div class="file-name">Index</div>
        <div class="file-size">24 KB</div>
      </div>
      <div class="file-card" onclick="open_file('prompt.html')">
        <div class="file-icon">💬</div>
        <div class="file-name">Prompt</div>
        <div class="file-size">2.5 KB</div>
      </div>
    </div>

    <div id="docs" class="content">
      <div class="file-card" onclick="open_file('Prompt-Master-Latest.html')">
        <div class="file-icon">📋</div>
        <div class="file-name">PM Latest</div>
        <div class="file-size">11 KB</div>
      </div>
      <div class="file-card" onclick="open_file('V2/Prompt-Master.html')">
        <div class="file-icon">📚</div>
        <div class="file-name">PM V2</div>
        <div class="file-size">—</div>
      </div>
    </div>
  </div>

  <script>
    function open_file(name) {
      window.location.href = name;
    }
    function switchTab(id) {
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
