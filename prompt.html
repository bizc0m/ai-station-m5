<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Pure Latest</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f7f8fb;
    }
    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    button {
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #0f7a3b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    pre {
      min-height: 280px;
      margin: 0;
      padding: 16px;
      border: 1px solid #d9dee7;
      border-radius: 8px;
      background: white;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 0.95rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    p {
      min-height: 20px;
      margin: 10px 0 0;
      color: #08612c;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Prompt Pure Latest</h1>
      <button id="copy" type="button">Copier</button>
    </header>
    <pre id="prompt">Chargement...</pre>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    const promptEl = document.getElementById('prompt');
    const statusEl = document.getElementById('status');
    const copyBtn = document.getElementById('copy');

    async function loadPrompt() {
      const response = await fetch(`prompt.md?v=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      promptEl.textContent = await response.text();
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(promptEl.textContent.trim());
        statusEl.textContent = 'Copié';
      } catch {
        const range = document.createRange();
        range.selectNodeContents(promptEl);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        statusEl.textContent = 'Sélectionné';
      }
    });

    loadPrompt().catch((error) => {
      promptEl.textContent = `Erreur : ${error.message}`;
    });
  </script>
</body>
</html>
